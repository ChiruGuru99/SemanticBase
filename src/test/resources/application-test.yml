spring:
  flyway:
    enabled: true
  ai:
    openai:
      api-key: test-key
      base-url: http://localhost:9999
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
    model:
      embedding: none
      # ChatController needs a ChatClient.Builder; points at the dead base-url above.
      chat: openai
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

logging:
  level:
    org.testcontainers: INFO
    com.semanticbase: DEBUG
