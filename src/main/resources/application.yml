spring:
  application:
    name: semanticbase
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # Required: fail-fast below still aborts startup if the config server is unreachable.
    # `optional:` only lets tests switch the client off with spring.cloud.config.enabled=false.
    # Override host/port with CONFIG_SERVER_URL when needed.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      name: ${spring.application.name}
      fail-fast: true

  # ----- Architectural config (kept local; coupled to code/schema) -----

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    # Gating switches: which AI auto-configurations get instantiated.
    # See feedback memory: spring.ai.model.* with `none` is the reliable way to skip features.
    # Chat and embeddings both use the OpenAI-compatible client; providers are set in the config server.
    model:
      embedding: openai
      chat: openai
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    # Vector store dimension is locked to the V1/V2 schema: whichever embedding model the config server
    # selects must output 768-dim vectors. Changing it requires a migration; do NOT move this to config server.
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: false
        schema-name: public
        table-name: chunks

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.semanticbase: DEBUG
    org.springframework.ai: INFO
