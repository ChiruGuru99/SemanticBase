<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SemanticBase</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #161922;
            --panel-2: #1c2030;
            --border: #2a2f3d;
            --fg: #e6e8ee;
            --muted: #8a93a6;
            --accent: #6aa8ff;
            --accent-2: #4a8be0;
            --user: #2a3b5e;
            --assistant: #1f2535;
            --error: #ff6b6b;
            --ok: #5cd382;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 56px 1fr;
        }
        header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 16px; margin: 0; letter-spacing: 0.3px; }
        header .actions { display: flex; gap: 8px; }
        button, .button {
            background: var(--panel-2);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #232838; }
        button.primary { background: var(--accent-2); border-color: var(--accent-2); }
        button.primary:hover { background: var(--accent); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        aside {
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
        }
        aside h2 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; letter-spacing: 0.5px; }
        .upload-row { display: flex; gap: 6px; margin-bottom: 16px; }
        .upload-row input[type=file] { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
        .doc {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12px;
            background: var(--panel-2);
        }
        .doc .name { font-weight: 500; word-break: break-all; }
        .doc .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
        .badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge.PENDING, .badge.PROCESSING { background: #3a3a1a; color: #d6d68a; }
        .badge.COMPLETED { background: #1f3a26; color: var(--ok); }
        .badge.FAILED { background: #3a1f24; color: var(--error); }

        main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 760px;
            border-radius: 10px;
            padding: 12px 16px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user { background: var(--user); align-self: flex-end; }
        .msg.assistant { background: var(--assistant); border: 1px solid var(--border); align-self: flex-start; width: fit-content; }
        .msg.error { background: #3a1f24; color: var(--error); align-self: flex-start; }
        .citations { font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .citations details { margin-bottom: 4px; }
        .citations summary { cursor: pointer; user-select: none; }
        .citations .snippet { padding: 6px 10px; margin-top: 4px; background: rgba(255,255,255,0.03); border-radius: 4px; font-size: 11px; }
        .source-tag { color: var(--accent); font-weight: 500; }
        .badge.tier-exact { background: #1f3a26; color: var(--ok); margin-left: 6px; }
        .badge.tier-semantic { background: #1f263a; color: var(--accent); margin-left: 6px; }

        form#composer {
            display: flex;
            gap: 8px;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }
        textarea {
            flex: 1;
            background: var(--panel-2);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 160px;
        }
        textarea:focus { outline: 2px solid var(--accent-2); outline-offset: -1px; }

        .toast {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .toast.show { opacity: 1; }
        .toast.error { border-color: var(--error); color: var(--error); }
        .toast.ok { border-color: var(--ok); color: var(--ok); }

        .hint { color: var(--muted); font-size: 12px; padding: 60px 24px; text-align: center; }
    </style>
</head>
<body>
<header>
    <h1>SemanticBase</h1>
    <div class="actions">
        <button id="purgeBtn" title="Clear cache for the current tenant">Purge cache</button>
    </div>
</header>

<aside>
    <h2>Upload</h2>
    <form id="uploadForm" class="upload-row">
        <input type="file" id="fileInput" required>
        <button type="submit" class="primary" id="uploadBtn">Upload</button>
    </form>

    <h2>Documents</h2>
    <div id="docs"></div>
</aside>

<main>
    <div id="chat">
        <div class="hint">Ask a question about your uploaded documents.</div>
    </div>
    <form id="composer">
        <textarea id="query" placeholder="Ask a question — e.g. what was the operating margin in Q3?" rows="1" required></textarea>
        <button type="submit" class="primary" id="sendBtn">Send</button>
    </form>
</main>

<div id="toast" class="toast"></div>

<script>
    const TENANT = 'default';

    const $ = (sel) => document.querySelector(sel);
    const chatEl = $('#chat');
    const queryEl = $('#query');
    const sendBtn = $('#sendBtn');
    const fileInput = $('#fileInput');
    const uploadBtn = $('#uploadBtn');
    const docsEl = $('#docs');
    const toastEl = $('#toast');

    function toast(msg, kind = 'ok') {
        toastEl.textContent = msg;
        toastEl.className = `toast show ${kind}`;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
    }

    function escapeHtml(s) {
        return (s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function fmtBytes(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    async function refreshDocs() {
        try {
            const res = await fetch(`/api/documents?tenantId=${TENANT}&limit=50`);
            if (!res.ok) throw new Error('list docs failed');
            const list = await res.json();
            docsEl.innerHTML = list.length === 0
                ? '<div style="color:var(--muted);font-size:12px">No documents yet.</div>'
                : list.map(d => `
                    <div class="doc">
                        <div class="name">${escapeHtml(d.sourceName)}</div>
                        <div class="meta">
                            <span class="badge ${d.status}">${d.status}</span>
                            ${fmtBytes(d.byteSize)}
                        </div>
                    </div>
                `).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function uploadFile(file) {
        const fd = new FormData();
        fd.append('file', file);
        uploadBtn.disabled = true;
        try {
            const res = await fetch('/api/ingest', { method: 'POST', body: fd });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'upload failed');
            toast(data.duplicate ? 'Already ingested' : 'Upload accepted, processing…', 'ok');
            // Poll for status updates so the badge flips
            pollDocs(8);
        } catch (e) {
            toast('Upload failed: ' + e.message, 'error');
        } finally {
            uploadBtn.disabled = false;
            fileInput.value = '';
        }
    }

    function pollDocs(times) {
        if (times <= 0) return;
        refreshDocs();
        setTimeout(() => pollDocs(times - 1), 1500);
    }

    function appendUser(text) {
        const div = document.createElement('div');
        div.className = 'msg user';
        div.textContent = text;
        chatEl.appendChild(div);
        scrollChat();
        return div;
    }

    function appendAssistant() {
        const wrapper = document.createElement('div');
        wrapper.className = 'msg assistant';
        const body = document.createElement('div');
        body.className = 'body';
        const cites = document.createElement('div');
        cites.className = 'citations';
        cites.style.display = 'none';
        wrapper.appendChild(body);
        wrapper.appendChild(cites);
        chatEl.appendChild(wrapper);
        scrollChat();
        return { wrapper, body, cites };
    }

    function appendError(message) {
        const div = document.createElement('div');
        div.className = 'msg error';
        div.textContent = message;
        chatEl.appendChild(div);
        scrollChat();
    }

    function scrollChat() {
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderCitations(citationsEl, citations, tier) {
        if (!citations || citations.length === 0) {
            citationsEl.style.display = 'none';
            return;
        }
        const tierBadge = tier
            ? `<span class="badge tier-semantic">${escapeHtml(tier)}</span>`
            : '';
        citationsEl.style.display = 'block';
        citationsEl.innerHTML = `<div style="margin-bottom:6px">Sources ${tierBadge}</div>` +
            citations.map(c => `
                <details>
                    <summary>[${c.n}] <span class="source-tag">${escapeHtml(c.sourceName ?? 'unknown')}</span>
                        ${c.chunkIndex != null ? '#' + c.chunkIndex : ''}
                        — score ${c.score?.toFixed(4) ?? ''}</summary>
                    <div class="snippet">${escapeHtml(c.snippet ?? '')}</div>
                </details>
            `).join('');
    }

    async function sendChat(query) {
        // Clear hint on first send
        const hint = chatEl.querySelector('.hint');
        if (hint) hint.remove();

        appendUser(query);
        const { body, cites } = appendAssistant();
        sendBtn.disabled = true;
        queryEl.disabled = true;

        let detectedTier = null;
        let deltaCount = 0;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                body: JSON.stringify({ query, tenantId: TENANT })
            });
            if (!res.ok) {
                const txt = await res.text();
                throw new Error(`HTTP ${res.status}: ${txt}`);
            }
            if (!res.body) throw new Error('streaming not supported by this browser');

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';
            let currentEvent = null;

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                let lineEnd;
                while ((lineEnd = buf.indexOf('\n')) >= 0) {
                    const line = buf.slice(0, lineEnd).replace(/\r$/, '');
                    buf = buf.slice(lineEnd + 1);

                    if (line === '') { continue; }
                    if (line.startsWith('event:')) {
                        currentEvent = line.slice(6).trim();
                    } else if (line.startsWith('data:')) {
                        const data = line.slice(5);
                        handleSseEvent(currentEvent, data, body, cites);
                        if (currentEvent === 'delta') {
                            deltaCount++;
                            // A single delta event = cache hit (full answer in one shot)
                            // Multiple deltas = live streaming
                        }
                    }
                }
            }
            // Heuristic: a single delta event means the answer arrived in one shot,
            // which is the cache-hit code path. Live Groq streaming emits many deltas.
            if (deltaCount === 1) {
                const existing = cites.dataset.citations;
                if (existing) {
                    renderCitations(cites, JSON.parse(existing), 'cached');
                }
            }
        } catch (e) {
            appendError(e.message || String(e));
        } finally {
            sendBtn.disabled = false;
            queryEl.disabled = false;
            queryEl.focus();
        }
    }

    function handleSseEvent(event, data, bodyEl, citesEl) {
        if (event === 'citations') {
            try {
                const parsed = JSON.parse(data);
                citesEl.dataset.citations = data;
                renderCitations(citesEl, parsed, null);
            } catch (e) {
                console.warn('bad citations event', data);
            }
        } else if (event === 'delta') {
            bodyEl.textContent += data;
            scrollChat();
        } else if (event === 'done') {
            // no-op
        }
    }

    async function purgeCache() {
        if (!confirm(`Purge all cached answers for tenant "${TENANT}"?`)) return;
        try {
            const res = await fetch(`/api/cache/${TENANT}`, { method: 'DELETE' });
            const data = await res.json();
            toast(`Purged ${data.deleted} cache keys`, 'ok');
        } catch (e) {
            toast('Purge failed: ' + e.message, 'error');
        }
    }

    // Wire up
    $('#uploadForm').addEventListener('submit', e => {
        e.preventDefault();
        if (fileInput.files[0]) uploadFile(fileInput.files[0]);
    });
    $('#composer').addEventListener('submit', e => {
        e.preventDefault();
        const q = queryEl.value.trim();
        if (!q) return;
        queryEl.value = '';
        autoResize();
        sendChat(q);
    });
    queryEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            $('#composer').requestSubmit();
        }
    });
    function autoResize() {
        queryEl.style.height = 'auto';
        queryEl.style.height = Math.min(queryEl.scrollHeight, 160) + 'px';
    }
    queryEl.addEventListener('input', autoResize);
    $('#purgeBtn').addEventListener('click', purgeCache);

    refreshDocs();
    queryEl.focus();
</script>
</body>
</html>
