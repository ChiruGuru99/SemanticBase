name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # mvnw is committed from Windows without the executable bit.
      - run: chmod +x mvnw

      # Runners ship Docker, so the Testcontainers integration tests run here instead of being skipped.
      # Evals are excluded by default (see eval.yml).
      - run: ./mvnw -B test

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
